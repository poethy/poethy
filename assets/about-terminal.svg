<svg width="880" height="350" viewBox="0 0 880 350" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">About Juan José — poethy — macOS terminal output</title>
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f6f6"/><stop offset="1" stop-color="#e8e8e8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.16"/></filter>
    <clipPath id="win"><rect x="30" y="18" width="820" height="306" rx="12"/></clipPath>
  </defs>
  <style>
    .line { font-family: 'SF Mono', Menlo, Monaco, 'Cascadia Code', Consolas, monospace; font-size: 16px; }
    .bar  { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
    .g { fill: #1a7f37; }
    .w { fill: #1d1d1f; }
    .m { fill: #6e6e73; }
    .a { fill: #0071e3; }
  </style>

  <rect x="30" y="18" width="820" height="306" rx="12" fill="#ffffff" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <rect x="30" y="18" width="820" height="46" fill="url(#tb)"/>
    <line x1="30" y1="64.5" x2="850" y2="64.5" stroke="#d2d2d7"/>
  </g>
  <rect x="30.5" y="18.5" width="819" height="305" rx="11.5" stroke="#c7c7cc"/>

  <circle cx="56" cy="41" r="6.5" fill="#ff5f57" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="78" cy="41" r="6.5" fill="#febc2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="100" cy="41" r="6.5" fill="#28c840" stroke="#1aab29" stroke-width="0.5"/>
  <text x="440" y="46" text-anchor="middle" class="bar m">about.txt — poethy</text>

  <clipPath id="typeCmd">
    <rect x="56" y="86" height="24" width="0">
      <animate attributeName="width" values="0;0;290;290" keyTimes="0;0.01;0.0367;1" dur="30s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <g clip-path="url(#typeCmd)">
    <text x="56" y="104" class="line"><tspan class="g">poethy@dev:~$ </tspan><tspan class="w">cat about.txt</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0433;0.0517;1" dur="30s" repeatCount="indefinite"/>
    <text x="56" y="138" class="line m">name:</text>
    <text x="200" y="138" class="line w">Juan José Ospina — a.k.a. "poethy"</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0483;0.0567;1" dur="30s" repeatCount="indefinite"/>
    <text x="56" y="166" class="line m">role:</text>
    <text x="200" y="166" class="line w">software engineering student</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0533;0.0617;1" dur="30s" repeatCount="indefinite"/>
    <text x="56" y="194" class="line m">work:</text>
    <text x="200" y="194" class="line"><tspan class="w">dev @ </tspan><tspan class="g">Hyvento</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0583;0.0667;1" dur="30s" repeatCount="indefinite"/>
    <text x="56" y="222" class="line m">stack:</text>
    <text x="200" y="222" class="line w">Angular + TypeScript (mostly)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0633;0.0717;1" dur="30s" repeatCount="indefinite"/>
    <text x="56" y="250" class="line m">learning:</text>
    <text x="200" y="250" class="line w">Next.js, Astro &amp; AI integrations</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0683;0.0767;1" dur="30s" repeatCount="indefinite"/>
    <text x="56" y="278" class="line m">daily:</text>
    <text x="200" y="278" class="line a">aprendiendo algo nuevo todos los días</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0733;0.0817;1" dur="30s" repeatCount="indefinite"/>
    <text x="56" y="306" class="line m">location:</text>
    <text x="200" y="306" class="line w">Colombia</text>
    <rect x="292" y="293" width="22" height="7" fill="#fcd116"/>
    <rect x="292" y="300" width="22" height="3.5" fill="#003893"/>
    <rect x="292" y="303.5" width="22" height="3.5" fill="#ce1126"/>
  </g>
</svg>
