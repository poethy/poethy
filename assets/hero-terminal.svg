<svg width="880" height="290" viewBox="0 0 880 290" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Juan José Ospina — poethy — macOS terminal profile banner</title>
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f6f6"/><stop offset="1" stop-color="#e8e8e8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.16"/></filter>
    <clipPath id="win"><rect x="30" y="18" width="820" height="246" rx="12"/></clipPath>
  </defs>
  <style>
    .line { font-family: 'SF Mono', Menlo, Monaco, 'Cascadia Code', Consolas, monospace; font-size: 16px; }
    .bar  { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
    .g { fill: #1a7f37; }
    .w { fill: #1d1d1f; }
    .m { fill: #6e6e73; }
    .a { fill: #0071e3; }
  </style>

  <rect x="30" y="18" width="820" height="246" rx="12" fill="#ffffff" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <rect x="30" y="18" width="820" height="46" fill="url(#tb)"/>
    <line x1="30" y1="64.5" x2="850" y2="64.5" stroke="#d2d2d7"/>
  </g>
  <rect x="30.5" y="18.5" width="819" height="245" rx="11.5" stroke="#c7c7cc"/>

  <circle cx="56" cy="41" r="6.5" fill="#ff5f57" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="78" cy="41" r="6.5" fill="#febc2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="100" cy="41" r="6.5" fill="#28c840" stroke="#1aab29" stroke-width="0.5"/>
  <text x="440" y="46" text-anchor="middle" class="bar m">poethy — -zsh — 80×24</text>

  <clipPath id="type1">
    <rect x="56" y="90" height="24" width="0">
      <animate attributeName="width" values="0;0;215;215" keyTimes="0;0.0167;0.0433;1" dur="30s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <g clip-path="url(#type1)">
    <text x="56" y="108" class="line"><tspan class="g">poethy@dev:~$ </tspan><tspan class="w">whoami</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.05" calcMode="discrete" dur="30s" repeatCount="indefinite"/>
    <text x="56" y="140" class="line w">Juan José Ospina Orozco — software engineer</text>
    <rect x="468" y="127" width="22" height="7" fill="#fcd116"/>
    <rect x="468" y="134" width="22" height="3.5" fill="#003893"/>
    <rect x="468" y="137.5" width="22" height="3.5" fill="#ce1126"/>
  </g>

  <clipPath id="type2">
    <rect x="56" y="154" height="24" width="0">
      <animate attributeName="width" values="0;0;670;670" keyTimes="0;0.0733;0.1467;1" dur="30s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <g clip-path="url(#type2)">
    <text x="56" y="172" class="line"><tspan class="g">poethy@dev:~$ </tspan><tspan class="w">echo "Hola, mundo — construyo cosas desde Colombia"</tspan></text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.15" calcMode="discrete" dur="30s" repeatCount="indefinite"/>
    <text x="56" y="204" class="line a">Hola, mundo — construyo cosas desde Colombia</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.17" calcMode="discrete" dur="30s" repeatCount="indefinite"/>
    <text x="56" y="236" class="line g">poethy@dev:~$ </text>
    <rect x="183" y="222" width="9" height="18" fill="#1d1d1f" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.75;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite" begin="5.1s"/>
    </rect>
  </g>
</svg>
