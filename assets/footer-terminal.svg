<svg width="880" height="170" viewBox="0 0 880 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">macOS terminal session closing — hasta pronto</title>
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f6f6"/><stop offset="1" stop-color="#e8e8e8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.16"/></filter>
    <clipPath id="win"><rect x="30" y="14" width="820" height="130" rx="12"/></clipPath>
  </defs>
  <style>
    .line { font-family: 'SF Mono', Menlo, Monaco, 'Cascadia Code', Consolas, monospace; font-size: 16px; }
    .bar  { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
    .g { fill: #1a7f37; }
    .w { fill: #1d1d1f; }
    .m { fill: #6e6e73; }
  </style>

  <rect x="30" y="14" width="820" height="130" rx="12" fill="#ffffff" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <rect x="30" y="14" width="820" height="40" fill="url(#tb)"/>
    <line x1="30" y1="54.5" x2="850" y2="54.5" stroke="#d2d2d7"/>
  </g>
  <rect x="30.5" y="14.5" width="819" height="129" rx="11.5" stroke="#c7c7cc"/>

  <circle cx="56" cy="34" r="6.5" fill="#ff5f57" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="78" cy="34" r="6.5" fill="#febc2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="100" cy="34" r="6.5" fill="#28c840" stroke="#1aab29" stroke-width="0.5"/>
  <text x="440" y="39" text-anchor="middle" class="bar m">poethy — exit</text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.01;0.0367;1" dur="30s" repeatCount="indefinite"/>
    <text x="56" y="90" class="line"><tspan class="g">poethy@dev:~$ </tspan><tspan class="w">exit</tspan></text>
    <text x="56" y="122" class="line m">[Process completed — hasta pronto 👋]</text>
  </g>
</svg>
